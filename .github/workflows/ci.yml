name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero runtime dependencies — no install step needed.
      # Verify the shipped client bundle matches its client/src sources.
      - run: node bin/build-client.js --check
      # Windows exercises the copy-fallback activation path (symlink assertions
      # are platform-aware via test/helpers/platform.js).
      - run: npm test
